name: Reproduce the cases

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that displayed code matches the downloadable files
        run: node scripts/bundle-checks.mjs --check
      - name: Check all four languages against the published evidence
        run: node tests/check-cases.mjs all
